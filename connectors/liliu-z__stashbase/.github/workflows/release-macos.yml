name: Release macOS

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the macOS assets to, for example v0.9.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.9.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-ci-gate:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-ci-gate.yml
    with:
      tag: ${{ startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag) }}

  macos-dmg:
    needs: release-ci-gate
    # Pinned, not macos-latest: the macOS 26.6 image refuses to unlock
    # electron-builder's temporary signing keychain in the runner's
    # pre-session context ("SecKeychainUnlock: The user name or passphrase
    # you entered is not correct"), where 26.5 accepted it. Lift the pin only
    # after a dispatched run on the newer image signs and notarizes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag) }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          version: '0.3.0'
          node-manager: false
          run-install: false
          cache: false

      - name: Validate release tag
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "::error::release tag $RELEASE_TAG does not match package.json version $expected"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify native build architecture
        run: test "$(node -p process.arch)" = "${{ matrix.arch }}"

      - uses: ./.github/actions/prepare-native-components

      - name: Prepare Apple signing credentials
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "::error::APPLE_API_KEY_P8, APPLE_API_KEY_ID, and APPLE_API_ISSUER are required"
            exit 1
          fi
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::MAC_CSC_LINK and MAC_CSC_KEY_PASSWORD are required"
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | /usr/bin/base64 -D > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build PDF/OCR download component
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: pnpm build:extractor-component

      - name: Build and verify macOS assets
        env:
          STASHBASE_SKIP_SIDECAR_BUILD: '1'
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: node scripts/publish-github-release.mjs --dry-run

      # Each build produces latest-mac.yml. Merge both before uploading so
      # neither architecture overwrites the other's update channel.
      - uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release.nosync/StashBase-*
            release.nosync/latest-mac.yml
            release.nosync/stashbase-extract-*

  publish-macos:
    needs: macos-dmg
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag) }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v7
        with:
          pattern: macos-*
          path: release.nosync/macos-builds
      - name: Merge verified macOS update artifacts
        run: node scripts/merge-macos-artifacts.mjs
      - name: Upload both architectures to the draft release
        run: node scripts/publish-github-release.mjs --skip-build --skip-smoke --require-draft
