name: Prepare native component cache

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep main's caches available to future release tags. This runs beside source
# CI, produces no installer, and never publishes or uses signing credentials.
concurrency:
  group: native-components-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: ./.github/actions/prepare-native-components
