name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  source-build:
    name: Source build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          version: '0.3.0'
          node-manager: false
          run-install: false
          cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Vite+ inventory
        run: pnpm test:toolchain

      # Static analysis, coverage, Story accessibility and catalog compilation
      # run once. Other platforms retain behavior tests and native builds.
      - name: Check supported renderer
        if: runner.os == 'Linux'
        run: pnpm check:web

      - name: Test renderer behavior
        if: runner.os != 'Linux'
        # Leave room for lazy imports plus each assertion's own wait timeout.
        run: pnpm test:renderer --maxWorkers=2 --testTimeout=15000

      - name: Build renderer
        if: runner.os != 'Linux'
        run: pnpm build:web

      - name: Check documentation and icons
        if: runner.os == 'Linux'
        run: pnpm test:docs && pnpm test:icons

      - name: Test renderer packaging input
        run: pnpm test:package-inputs

      - name: Check test inventory wiring
        run: pnpm test:inventory

      - name: Install Python sidecar dependencies
        id: python
        run: pnpm setup:python

      # Collect every host failure after setup; failures still fail the job.
      - name: Test Python sidecars
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm test:python

      - name: Test release CI gate
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm test:release-gate

      - name: Test macOS signing contract
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm test:macos-signing

      - name: Test optional Windows signing contract
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm test:windows-signing

      - name: Test desktop update contracts
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm test:updates

      - name: Test application config and hosted account
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm test:config

      - name: Test Electron window lifecycle
        id: electron
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: npm run test:electron

      - name: Test conversion scheduler
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm test:conversion-scheduler

      - name: Test project file transactions
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm test:project-files

      - name: Test retrieval
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm test:retrieval

      - name: Test agent adapters
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm test:agent

      - name: Test bundled OpenCode runtime
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm test:opencode:native

      - name: Test MCP transports
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm test:mcp

      - name: Typecheck server + mcp + Electron
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm typecheck:host

      - name: Build server + MCP
        id: services
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm build:services

      - name: Smoke real Electron app lifecycle (Linux)
        if: ${{ !cancelled() && steps.services.outcome == 'success' && steps.electron.outcome == 'success' && runner.os == 'Linux' }}
        run: xvfb-run -a pnpm test:electron:smoke:built

      - name: Smoke real Electron app lifecycle (macOS and Windows)
        if: ${{ !cancelled() && steps.services.outcome == 'success' && steps.electron.outcome == 'success' && runner.os != 'Linux' }}
        run: pnpm test:electron:smoke:built
