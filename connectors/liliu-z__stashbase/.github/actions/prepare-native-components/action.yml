name: Prepare native components
description: Restore exact unsigned component inputs or build them; never cache installers or signing output.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      id: python
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: python/constraints.txt

    - name: Check locked Python inputs
      shell: bash
      run: node scripts/lock-python.mjs --check

    - name: Identify runner image
      id: image
      shell: bash
      run: |
        test -n "$ImageOS" && test -n "$ImageVersion"
        echo "id=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

    - name: Restore unsigned Python components
      id: python-cache
      uses: actions/cache/restore@v5
      with:
        path: python/sidecar.nosync
        key: python-components-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.id }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('python/*.py', 'python/*requirements*.txt', 'python/constraints.txt', 'scripts/build-python-sidecar.mjs', 'scripts/setup-python.mjs', 'scripts/lock-python.mjs', '.github/actions/prepare-native-components/action.yml') }}

    - name: Build unsigned Python components
      if: steps.python-cache.outputs.cache-hit != 'true'
      shell: bash
      run: node scripts/build-python-sidecar.mjs --with-extract

    # Save before extractor signing mutates its input directory. Only main can
    # populate shared caches; release tags can read main's exact-key entries.
    - name: Save unsigned Python components
      if: steps.python-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v5
      with:
        path: python/sidecar.nosync
        key: ${{ steps.python-cache.outputs.cache-primary-key }}

    - name: Report component reuse
      shell: bash
      env:
        PYTHON_CACHE_HIT: ${{ steps.python-cache.outputs.cache-hit }}
      run: |
        {
          echo '### Native component reuse'
          echo "Python cache hit: ${PYTHON_CACHE_HIT:-false}"
        } >> "$GITHUB_STEP_SUMMARY"
