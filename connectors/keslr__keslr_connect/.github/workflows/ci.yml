name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A starter kit that silently stops working against the live provider is
    # worse than no starter kit. Run the smoke test daily so we find out before
    # an integrator does.
    - cron: '17 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage

  smoke:
    name: Smoke test against the live provider
    runs-on: ubuntu-latest
    # Only where secrets are available; forks get the unit tests above.
    if: github.event_name == 'schedule' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Discovery and JWKS reachable
        env:
          KESLR_ISSUER: ${{ vars.KESLR_ISSUER || 'https://id.keslr.com' }}
        run: node scripts/smoke.mjs
